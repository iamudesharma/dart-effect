name: Cache quality
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'packages/**'
      - 'tool/validate_memory_fixes.py'
      - 'tool/memory_fixes_probe.dart'
      - 'tool/cache_validation.py'
      - 'tool/cache_performance.dart'
      - 'tool/performance_memory.dart'
      - '.github/workflows/cache-quality.yml'
  push:
    branches: [dart-effect]
jobs:
  cache-contracts-and-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0'
      - name: Resolve prerequisites
        run: |
          dart pub get
          for package in effect_cache effect_http effect_sql effect_postgres effect_mysql effect_openai; do
            (cd packages/$package && dart pub get)
          done
      - name: Contracts, examples, JIT/AOT and post-GC retention
        run: python3 tool/cache_validation.py --report build/cache-followup-validation.json
      - name: All implemented package memory regressions
        run: python3 tool/validate_memory_fixes.py --report build/memory-fixes-ci-validation.json
      - name: Website evidence, routes and draft boundaries
        run: |
          python3 website/build.py
          python3 website/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-validation
          path: |
            build/cache-followup-validation.json
            build/memory-fixes-ci-validation.json
            build/memory-fixes/
            build/cache-validation/
